workflows:
  xingbo-android-debug:
    name: Xingbo Android test APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Check Flutter project
        script: flutter analyze --no-fatal-warnings
      - name: Build Android APK
        script: flutter build apk --debug --build-name=0.2.7 --build-number=15
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - /tmp/flutter_logs/*.log

  xingbo-ios-adhoc:
    name: Xingbo iOS auto ad filter signed IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.eggplant1907.jet4469
      flutter: 3.47.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Prepare iOS project
        script: flutter build ios --config-only --release --no-codesign
      - name: Install CocoaPods dependencies
        script: find ios -name "Podfile" -execdir pod install \;
      - name: Set up iOS signing
        script: xcode-project use-profiles
      - name: Check Flutter project
        script: flutter analyze
      - name: Test playlist filtering and application
        script: flutter test
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=0.2.7 \
            --build-number=15 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  xingbo-ios-verify:
    name: Xingbo iOS unsigned compile check
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Compile iOS without signing
        script: flutter build ios --release --no-codesign --build-name=0.2.7 --build-number=15
      - name: Archive unsigned application for inspection
        script: ditto -c -k --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-Runner.zip
    artifacts:
      - build/ios/unsigned-Runner.zip
      - /tmp/xcodebuild_logs/*.log

